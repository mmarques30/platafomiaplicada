<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prévia — E-mails de boas-vindas IAplicada</title>
<style>
  body { margin: 0; background: #E4E2D7; font-family: Arial, Helvetica, sans-serif; color: #1a1c19; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 16px 60px; }
  .page-title { font-size: 20px; font-weight: 700; margin: 8px 0 4px; }
  .page-sub { color: #6b6f66; font-size: 14px; margin: 0 0 8px; }
  .variant-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #7C8B2A; font-weight: 700; margin: 28px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-title">Prévia dos e-mails de boas-vindas</div>
  <p class="page-sub">Renderização real do template (dados de exemplo). Três variações: Academy, Builder e System.</p>
  <div id="root"></div>
</div>

<script>
  const BRAND = {
    green: "#7C8B2A", greenBright: "#AFC040", ink: "#1a1c19", body: "#3d4038",
    pageBg: "#EFEDE4", panel: "#16180F", panelText: "#F3F2E9", panelMuted: "#9fa392",
    muted: "#6b6f66", hairline: "#dcd9cc",
  };
  const PLATAFORMA_URL = "https://plataforma.iaplicada.com";
  const LOGO = PLATAFORMA_URL + "/logo-marca-completa.png";

  const VARIANT_COPY = {
    academy: {
      intro: "Seu acesso ao <strong>IAplicada Academy</strong> está pronto. Bora aplicar IA na sua rotina.",
      cta: "Acessar o Academy",
      dica: 'Comece pela primeira trilha em "Aprender".',
    },
    business_parceria: {
      intro: "Seu acesso ao <strong>IAplicada Builder</strong> está pronto. Sua mentoria começa agora.",
      cta: "Acessar o Builder",
      dica: 'Faça seu Diagnóstico e veja seu roadmap em "Mentoria".',
    },
    business_sistemas: {
      intro: "Seu acesso ao <strong>IAplicada System</strong> está pronto. A IAplicada constrói e você acompanha.",
      cta: "Acessar o System",
      dica: 'Acompanhe o andamento do projeto em "Meu Projeto".',
    },
  };

  function buildEmail({ nome, email, senha, plano }) {
    const copy = VARIANT_COPY[plano] || VARIANT_COPY.academy;
    const primeiroNome = (nome || "").trim().split(" ")[0] || "boas-vindas";
    const policy = plano === "academy"
      ? `<tr><td style="padding:6px 0 0 0;">
            <p style="margin:0;font-size:12px;line-height:1.6;color:${BRAND.muted};">
              Antes de começar, vale ler a
              <a href="${PLATAFORMA_URL}/politica-servicos" target="_blank" style="color:${BRAND.green};font-weight:600;text-decoration:underline;">Política de Serviços</a>
              (também em Configurações).
            </p>
          </td></tr>`
      : "";
    return `
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:${BRAND.pageBg};padding:40px 16px;">
  <tr><td align="center">
    <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;">
      <tr><td style="padding:0 0 28px 0;">
        <img src="${LOGO}" alt="IAplicada" height="30" style="height:30px;display:block;border:0;" onerror="this.outerHTML='<span style=\\'font-family:Georgia,serif;font-size:22px;font-weight:700;color:#1a1c19;\\'>IAplicada</span>'" />
      </td></tr>
      <tr><td style="font-family:Georgia,serif;">
        <h1 style="margin:0 0 10px 0;font-size:28px;line-height:1.15;color:${BRAND.ink};font-weight:400;">Olá, ${primeiroNome}!</h1>
      </td></tr>
      <tr><td style="padding:0 0 24px 0;">
        <p style="margin:0;font-size:15px;line-height:1.6;color:${BRAND.body};">${copy.intro}</p>
      </td></tr>
      <tr><td style="padding:0 0 24px 0;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:${BRAND.panel};border-radius:14px;">
          <tr><td style="padding:22px 24px;">
            <p style="margin:0 0 14px 0;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:${BRAND.panelMuted};">Seus dados de acesso</p>
            <p style="margin:0 0 2px 0;font-size:12px;color:${BRAND.panelMuted};">E-mail</p>
            <p style="margin:0 0 16px 0;font-size:16px;color:${BRAND.panelText};font-weight:600;">${email}</p>
            <p style="margin:0 0 2px 0;font-size:12px;color:${BRAND.panelMuted};">Senha temporária</p>
            <p style="margin:0;font-size:18px;color:${BRAND.greenBright};font-weight:700;font-family:'Courier New',monospace;letter-spacing:1px;">${senha}</p>
          </td></tr>
        </table>
      </td></tr>
      <tr><td style="padding:0 0 14px 0;">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="border-radius:999px;background-color:${BRAND.green};">
          <a href="${PLATAFORMA_URL}" target="_blank" style="display:inline-block;padding:14px 32px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:999px;">${copy.cta}</a>
        </td></tr></table>
      </td></tr>
      <tr><td style="padding:0 0 6px 0;">
        <p style="margin:0;font-size:13px;line-height:1.6;color:${BRAND.body};">No primeiro acesso, troque a senha temporária por uma senha pessoal. ${copy.dica}</p>
      </td></tr>
      ${policy}
      <tr><td style="padding:24px 0 0 0;">
        <p style="margin:0;font-size:12px;line-height:1.6;color:${BRAND.muted};border-top:1px solid ${BRAND.hairline};padding-top:18px;">Precisa de ajuda? É só responder este e-mail.</p>
      </td></tr>
    </table>
  </td></tr>
</table>`;
  }

  const exemplos = [
    { label: "Academy", plano: "academy", nome: "Marina", email: "marina@empresa.com", senha: "aplica2026" },
    { label: "Builder (mentoria individual)", plano: "business_parceria", nome: "Rodrigo", email: "rodrigo@empresa.com", senha: "aplica2026" },
    { label: "System (B2B / empresa)", plano: "business_sistemas", nome: "Camila", email: "camila@empresa.com", senha: "aplica2026" },
  ];

  document.getElementById("root").innerHTML = exemplos
    .map((e) => `<div class="variant-label">${e.label}</div>` + buildEmail(e))
    .join("");
</script>
</body>
</html>
